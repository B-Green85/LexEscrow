[package]
name = "lexescrow"
version = "0.1.0"
description = "LexEscrow — AI-Governed Legal Retainer Release"
authors = ["Brandon Green"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (only an issue on Windows, see rust-lang/cargo#8519).
name = "lexescrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native save dialog for the audit-report PDF export (audit-pdf-export.ts).
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ArtifactGuard — SHA-256 hashing + hex encoding
sha2 = "0.10"
hex = "0.4"

# AnchorReceipt — HMAC-SHA256 seal over the fingerprint (spec §8)
hmac = "0.12"

# Persistence — SQLite via sqlx (async, tokio runtime, bundled SQLite)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
# "net" + "io-util": the loopback listener that receives DocuSign's embedded
# signing return-URL redirect (esign_callback.rs).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util"] }

# Identifiers & time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Notification layer — SMTP email (lettre) + Twilio SMS (reqwest), rustls only
# (no system OpenSSL required).
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Load SMTP/Twilio config from a local .env at startup.
dotenvy = "0.15"

# OS-native credential store — macOS Keychain, Windows Credential Manager,
# Linux Secret Service (libsecret). The alternative backend to the AES vault
# below; the operator picks one at first launch (see credential_store.rs).
keyring = { version = "2", features = ["linux-secret-service"] }

# Credential vault — scrypt KDF + AES-256-GCM (Node crypto → Rust).
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"

# DocuSign eSign — OAuth JWT Grant (RS256). `from_rsa_pem` parses both PKCS#1
# and PKCS#8 DocuSign keypairs, so no separate RSA crate is needed.
jsonwebtoken = "9"

# WebSocket AI transport
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = "0.3"

# Document text extraction (field suggestion at Document Load).
# Excel reading
calamine = { version = "0.24", features = ["dates"] }
# Zip for DOCX extraction
zip = "0.6"
# PDF content streams are almost always FlateDecode-compressed. Poppler's
# `pdftotext` is preferred when installed; this is what lets the built-in
# fallback read real PDFs rather than only their object structure.
flate2 = "1"

# Blockchain write-authorization gate — bcrypt over the confirmation password
# (blockchain_write_auth.rs). Cost 12: ~250ms per verify, which is deliberate
# friction on a prompt an operator sees only when changing a deployer key.
bcrypt = "0.19"

# On-chain settlement (Path A) — EIP-1559 signing + broadcast of the real
# `directSettle` call (cre.rs::execute_direct_settle). Pinned, with only the
# features that path needs: an HTTP provider over rustls (matching reqwest
# above), the local private-key signer, and sol-types to ABI-encode the call.
alloy = { version = "=2.1.1", default-features = false, features = [
    "std",
    "provider-http",
    "reqwest-rustls-tls",
    "signer-local",
    "sol-types",
    "rpc-types",
    "network",
] }

[profile.dev]
# Faster incremental builds during the hackathon.
incremental = true
